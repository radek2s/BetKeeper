name: Suggest Improvement
description: Propose an enhancement or idea to make the project better
title: "[Improvement]: "
labels: ["improvement idea"]
type: enhancement

body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the friction, limitation, or inconvenience you’re experiencing.
      placeholder: "Example: The dashboard loads useful data, but it’s hard to scan quickly."

  - type: textarea
    id: proposal
    attributes:
      label: Your suggested improvement
      description: What would you like to see changed or added?
      placeholder: "Example: Add color‑coded sections or grouping to improve readability."
    validations:
      required: true

  - type: textarea
    id: value
    attributes:
      label: Why is this improvement valuable?
      description: Explain how this change would help users or improve the experience.
      placeholder: "Example: It would make daily monitoring faster and reduce cognitive load."

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this improvement to you?
      options:
        - High – Significant usability or workflow improvement
        - Medium – Helpful but not urgent
        - Low – Nice to have
      default: Medium

  - type: upload
    id: screenshots
    attributes:
      label: Screenshots or mockups (optional)
      description: Add images or designs that illustrate your idea.
